name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint / Typecheck / Test / Build / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarQube Cloud の正確な差分解析・blame 取得のためフル履歴を取得
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Biome CI (Lint & Format)
        run: npm run check:ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Production build
        run: npm run build:only

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Check SonarQube Cloud configuration
        id: sonar-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set. Skipping SonarQube Cloud scan."
          fi

      - name: SonarQube Cloud Scan
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
