# SonarQube Cloud (旧 SonarCloud) プロジェクト設定
sonar.organization=not-0x138
sonar.projectKey=not-0x138_md-oretools

# 解析対象ソース・テスト
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# 自動生成 UI 部品（shadcn/ui）を静的解析対象から除外
sonar.exclusions=src/components/ui/**,**/*.test.ts,**/*.test.tsx

# Vitest はドメインロジック・データ検証層を中心にテストする方針のため、
# React 表示コンポーネント・ブラウザ API 依存 Hooks・CI 運用スクリプトはカバレッジ計測対象外とする（静的解析自体は継続）
sonar.coverage.exclusions=src/components/ui/**,src/app/**,src/features/*/components/**,src/features/*/hooks/**,src/features/*/index.ts,src/shared/db/database.ts,src/shared/lib/useTransientMessage.ts,src/shared/lib/cn.ts,src/main.tsx,scripts/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx

# 初期テンプレート辞書データ（構造が反復する静的データ定義）を重複検知対象外とする
sonar.cpd.exclusions=src/features/*/data/**

# Vitest (v8) が出力する LCOV カバレッジレポート
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 文字コード
sonar.sourceEncoding=UTF-8
