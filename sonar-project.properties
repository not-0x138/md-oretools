# SonarQube Cloud (旧 SonarCloud) プロジェクト設定
# 初回セットアップ時に sonar.organization と sonar.projectKey を
# 自身の SonarQube Cloud の値に書き換えてください。
sonar.organization=YOUR_SONAR_ORGANIZATION
sonar.projectKey=YOUR_SONAR_ORGANIZATION_md-oretools

# 解析対象ソース・テスト
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# 自動生成 UI 部品（shadcn/ui）やエントリポイント等を解析・カバレッジ対象から調整
sonar.exclusions=src/components/ui/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=src/components/ui/**,src/main.tsx,**/*.d.ts,**/*.test.ts,**/*.test.tsx

# Vitest (v8) が出力する LCOV カバレッジレポート
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 文字コード
sonar.sourceEncoding=UTF-8
